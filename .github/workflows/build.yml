name: Build

# Both builds compile against toolchains that ship with their OS, so there is nothing to
# install on either runner. The point of running both is to catch a break in the platform
# you are not sitting in front of.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Swift / AppKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: swiftc --version

      - name: Build
        run: ./macos/build.sh

      - name: Check the bundle
        run: |
          binary="bin/Clawd.app/Contents/MacOS/Clawd"
          test -x "$binary" || { echo "no executable at $binary"; exit 1; }
          plutil -lint bin/Clawd.app/Contents/Info.plist
          lipo -info "$binary"
          codesign -dv bin/Clawd.app

      # upload-artifact zips its input, which drops the executable bit and the code
      # signature. Tar it first so the downloaded .app actually runs.
      - name: Package
        run: tar -czf Clawd-macos.tar.gz -C bin Clawd.app

      - uses: actions/upload-artifact@v4
        with:
          name: Clawd-macos
          path: Clawd-macos.tar.gz

  windows:
    name: Windows (C# / WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Check the executable
        shell: pwsh
        run: |
          if (-not (Test-Path bin\Clawd.exe)) { throw "bin\Clawd.exe was not produced" }
          Get-Item bin\Clawd.exe | Format-List Name, Length, LastWriteTime

      - uses: actions/upload-artifact@v4
        with:
          name: Clawd-windows
          path: bin/Clawd.exe
